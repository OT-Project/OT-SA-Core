# OT-SA SSH User Access Management Configuration
# Auto-generated by OPNsense — DO NOT EDIT MANUALLY
# Template: OPNsense/Auth/SshManagement

{% if helpers.exists('OPNsense.auth.sshuser.users.user') %}
{% set enabled_users = [] %}
{% for user in helpers.toList('OPNsense.auth.sshuser.users.user') %}
{%   if user.enabled == '1' %}
{%     do enabled_users.append(user) %}
{%   endif %}
{% endfor %}

{% if enabled_users %}
# ============================================================
# Global: Restrict SSH access to configured users only
# ============================================================
{% set allow_users_parts = [] %}
{% for user in enabled_users %}
{%   set username = user.username %}
{%   if user.allowedNetworks is defined and user.allowedNetworks|length > 0 %}
{%     for network in user.allowedNetworks.split(',') %}
{%       do allow_users_parts.append(username ~ '@' ~ network|trim) %}
{%     endfor %}
{%   else %}
{%     do allow_users_parts.append(username) %}
{%   endif %}
{% endfor %}
AllowUsers {{ allow_users_parts|join(' ') }}

# Global idle check interval (used with per-user ClientAliveCountMax)
ClientAliveInterval 60

{% for user in enabled_users %}
# ------------------------------------------------------------
# User: {{ user.username }}
# Permission: {{ user.permissionGroup }}
# ------------------------------------------------------------
Match User {{ user.username }}
{% if user.authMethod == 'key_only' %}
    PasswordAuthentication no
    PubkeyAuthentication yes
{% elif user.authMethod == 'password' %}
    PasswordAuthentication yes
    PubkeyAuthentication no
{% elif user.authMethod == 'both' %}
    PasswordAuthentication yes
    PubkeyAuthentication yes
{% endif %}
{% if user.portForwarding == '1' %}
    AllowTcpForwarding yes
{% else %}
    AllowTcpForwarding no
{% endif %}
    MaxSessions {{ user.maxSessions }}
{% if user.sessionTimeout|int > 0 %}
    ClientAliveCountMax {{ user.sessionTimeout }}
{% else %}
    ClientAliveCountMax 0
{% endif %}

{% endfor %}
{% endif %}
{% endif %}
