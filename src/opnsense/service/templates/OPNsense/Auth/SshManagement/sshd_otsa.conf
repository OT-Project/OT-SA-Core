# OT-SA SSH User Access Management Configuration
# Auto-generated by OPNsense — DO NOT EDIT MANUALLY
# Template: OPNsense/Auth/SshManagement

{% set enabled_users = [] %}
{% for user in helpers.toList('system.user') %}
{%   if user.ssh_enabled is defined and user.ssh_enabled == '1' and user.disabled|default('0') != '1' %}
{%     do enabled_users.append(user) %}
{%   endif %}
{% endfor %}

{% if enabled_users %}
# ============================================================
# Global: Restrict SSH access to configured users only
# ============================================================
{% set allow_users_parts = [] %}
{% for user in enabled_users %}
{%   set username = user.name %}
{%   if user.ssh_allowed_networks is defined and user.ssh_allowed_networks|length > 0 %}
{%     set nets = user.ssh_allowed_networks.split(',') %}
{%     set is_any = (nets|length == 1 and nets[0]|trim == '0.0.0.0/0') %}
{%     if is_any %}
{# 0.0.0.0/0 means allow from any network — no per-network restriction #}
{%       do allow_users_parts.append(username) %}
{%     else %}
{%       for network in nets %}
{%         do allow_users_parts.append(username ~ '@' ~ network|trim) %}
{%       endfor %}
{%     endif %}
{%   else %}
{# Default: resolve LAN subnet. If no LAN, user is blocked (not added to AllowUsers) #}
{%     set lan_net = helpers.getInterfaceConfig('lan') %}
{%     if lan_net and lan_net.ipaddr is defined and lan_net.subnet is defined %}
{%       do allow_users_parts.append(username ~ '@' ~ lan_net.ipaddr ~ '/' ~ lan_net.subnet) %}
{%     endif %}
{%   endif %}
{% endfor %}

{% if allow_users_parts %}
AllowUsers {{ allow_users_parts|join(' ') }}
{% endif %}

# Global idle check interval (used with per-user ClientAliveCountMax)
ClientAliveInterval 60

{% for user in enabled_users %}
# ------------------------------------------------------------
# User: {{ user.name }}
# Auth: {{ user.ssh_auth_method|default('password') }}
# ------------------------------------------------------------
Match User {{ user.name }}
{% if user.ssh_auth_method is defined and user.ssh_auth_method == 'key_only' %}
    PasswordAuthentication no
    PubkeyAuthentication yes
{% elif user.ssh_auth_method is defined and user.ssh_auth_method == 'both' %}
    PasswordAuthentication yes
    PubkeyAuthentication yes
{% else %}
    PasswordAuthentication yes
    PubkeyAuthentication no
{% endif %}
    AllowTcpForwarding no

{% endfor %}
{% endif %}
